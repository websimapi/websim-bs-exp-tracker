<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Window/Tab Capture with Cropping, Auto OCR & EXP Rate</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/customSelect.css" />
  </head>
  <body>
    <header>
      <h1>Live Window / Browser Tab Capture</h1>
    </header>
    <main>
      <section id="display-container">
        <!-- Video container which will show the live screen capture -->
        <video id="capture-video" playsinline autoplay></video>
        <!-- Cropping overlay (positioned on top of the video) -->
        <div id="crop-overlay"></div>
      </section>
      <!-- Moved controls section below the video feed -->
      <section id="controls">
        <button id="capture-btn">Select Screen To Capture</button>
        <button id="crop-btn">Select Crop Region</button>
        <button id="reset-crop-btn" style="display:none;">Reset Crop</button>
        <!-- Labeling Controls: Custom Skill dropdown with icons for OCR readings -->
        <div id="labeling-controls">
          <label for="skill-select">Select Skill: </label>
          <!-- The select element will be transformed into a custom dropdown with icons -->
          <select id="skill-select">
            <optgroup label="Hopeport">
              <option value="sword_and_shield" data-icon="/36px-Guard_icon.webp">Guard</option>
              <option value="chef_icon" data-icon="/36px-Chef_icon.webp">Chef</option>
              <option value="fisher_icon" data-icon="/36px-Fisher_icon.webp">Fishing</option>
              <option value="forager_icon" data-icon="/36px-Forager_icon.webp">Foraging</option>
              <option value="alchemist_potion" data-icon="/32px-Alchemist_icon.webp">Alchemist</option>
            </optgroup>
            <optgroup label="Hopeforest">
              <option value="scout_sword_icon" data-icon="/36px-Scout_icon.webp">Scout</option>
              <option value="gatherer_icon" data-icon="/36px-Gatherer_icon.webp">Gatherer</option>
              <option value="woodcutter_icon" data-icon="/36px-Woodcutter_icon.webp">Woodcutter</option>
              <option value="circular_saw_blade" data-icon="/36px-Carpenter_icon.webp">Carpenter</option>
            </optgroup>
            <optgroup label="Mine of Mantuban">
              <option value="minefighter_icon" data-icon="/36px-Miner_icon.webp">Minefighter</option>
              <option value="pixel_bone_icon" data-icon="/36px-Bonewright_icon.webp">Bonewright</option>
              <option value="mining_pickaxe_icon" data-icon="/36px-Miner_icon.webp">Miner</option>
              <option value="blacksmith_ingot" data-icon="/36px-Blacksmith_icon.webp">Blacksmith</option>
              <option value="stonemason_icon" data-icon="/30px-Stonemason_icon.webp">Stonemason</option>
            </optgroup>
            <optgroup label="Crenopolis">
              <option value="shield_sword_icon" data-icon="/36px-Watchperson_icon.webp">Watchperson</option>
              <option value="detective_icon" data-icon="/32px-Detective_icon.webp">Detective</option>
              <option value="leatherworker_icon" data-icon="/36px-Leatherworker_icon.webp">Leatherworker</option>
              <option value="merchant_stall_icon" data-icon="/36px-Merchant_icon.webp">Merchant</option>
            </optgroup>
          </select>
          <button id="reset-exp-btn">Reset Exp Rate</button>
          <button id="clear-ocr-btn">Clear OCR List</button>
          <!-- Archive Buttons -->
          <button id="archive-btn">Archive Data</button>
          <button id="view-journal-btn">View Archive</button>
          <!-- Clear Archive Button on Main Page -->
          <button id="clear-archives-btn">Clear Archive Data</button>
          <!-- Export/Import Archive Buttons -->
          <button id="export-archive-btn">Export Archive</button>
          <button id="import-archive-btn">Import Archive</button>
          <!-- Hidden file input for importing archive json file -->
          <input type="file" id="import-file-input" accept="application/json" style="display:none;" />
        </div>
      </section>
      <section id="cropped-feed">
        <h2>Cropped Feed</h2>
        <canvas id="cropped-canvas"></canvas>
        <div id="stats-container">
          <div id="ocr-list-panel">
            <h2>OCR Numbers</h2>
            <div id="ocr-results-container"></div>
          </div>
          <div id="exp-panel">
            <div id="exp-rate">Exp Rate: N/A</div>
            <div id="total-exp">Total Exp: N/A</div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <p>Note: This feature requires browser support for the Screen Capture API.</p>
    </footer>
    <!-- Modal for Archived Journal -->
    <div id="journal-modal" class="modal">
      <div class="modal-content">
        <span class="modal-close">&times;</span>
        <h2>Archived Journal</h2>
        <div id="journal-entries"></div>
      </div>
    </div>
    <!-- Include Tesseract.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
    <!-- Custom Skill Dropdown JS -->
    <script src="./js/customSelect.js" type="module"></script>
    <!-- Main entry point -->
    <script src="./js/main.js" type="module"></script>

</body>
</html>
