<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Window/Tab Capture with Cropping</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Live Window / Browser Tab Capture with Cropping</h1>
  </header>
  <main>
    <section id="controls">
      <button id="capture-btn">Select Screen To Capture</button>
      <button id="select-crop-btn" disabled>Select Crop Region</button>
      <button id="apply-crop-btn" disabled>Apply Crop</button>
      <button id="reset-btn" disabled>Reset Crop</button>
    </section>
    <section id="display-container">
      <!-- Video container which will show the live screen capture -->
      <video id="capture-video" playsinline autoplay></video>
      <!-- Canvas for cropped output -->
      <canvas id="cropped-canvas"></canvas>
      <!-- Cropping overlay -->
      <div id="crop-overlay" hidden></div>
    </section>
  </main>
  <footer>
    <p>Note: This feature requires browser support for Screen Capture API.</p>
  </footer>
  <script src="script.js" type="module"></script>

</html>
