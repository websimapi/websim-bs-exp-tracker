<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Window/Tab Capture with Cropping & Multiple OCR</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Include Tesseract.js for OCR (v2.1.5) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
  </head>
  <body>
    <header>
      <h1>Live Window / Browser Tab Capture</h1>
    </header>
    <main>
      <section id="controls">
        <button id="capture-btn">Select Screen To Capture</button>
        <button id="crop-btn">Select Crop Region</button>
        <button id="reset-crop-btn" style="display:none;">Reset Crops</button>
      </section>
      <section id="display-container">
        <!-- Video container showing live capture -->
        <video id="capture-video" playsinline autoplay></video>
        <!-- Cropping overlays will be appended here dynamically -->
      </section>
      <section id="cropped-feed">
        <h2>Cropped Feed</h2>
        <div id="cropped-feed-container"></div>
      </section>
    </main>
    <footer>
      <p>Note: This feature requires browser support for the Screen Capture API.</p>
    </footer>
    <script src="script.js" type="module"></script>

</body>
</html>
