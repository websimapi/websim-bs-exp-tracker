<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Window/Tab Capture with Cropping, Auto OCR & EXP Rate</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Live Window / Browser Tab Capture</h1>
    </header>
    <main>
      <section id="display-container">
        <!-- Video container which will show the live screen capture -->
        <video id="capture-video" playsinline autoplay></video>
        <!-- Cropping overlay (positioned on top of the video) -->
        <div id="crop-overlay"></div>
      </section>
      <!-- Moved controls section below the video feed -->
      <section id="controls">
        <button id="capture-btn">Select Screen To Capture</button>
        <button id="crop-btn">Select Crop Region</button>
        <button id="reset-crop-btn" style="display:none;">Reset Crop</button>
        <!-- Labeling Controls: selecting a skill sets the current label for new OCR readings -->
        <div id="labeling-controls">
          <label for="skill-select">Select Skill: </label>
          <select id="skill-select">
            <option value="">--Select Skill--</option>
            <option value="Guard">Guard</option>
            <option value="Chef">Chef</option>
            <option value="Fisher">Fisher</option>
            <option value="Forager">Forager</option>
            <option value="Alchemist">Alchemist</option>
            <option value="Woodcutter">Woodcutter</option>
            <option value="Scout">Scout</option>
            <option value="Gatherer">Gatherer</option>
            <option value="Carpenter">Carpenter</option>
            <option value="Minefighter">Minefighter</option>
            <option value="Bonewright">Bonewright</option>
            <option value="Miner">Miner</option>
            <option value="Blacksmith">Blacksmith</option>
            <option value="Stonemason">Stonemason</option>
            <option value="Merchant">Merchant</option>
            <option value="Detective">Detective</option>
            <option value="Watchperson">Watchperson</option>
            <option value="Leatherworker">Leatherworker</option>
          </select>
          <button id="reset-exp-btn">Reset Exp Rate</button>
          <button id="clear-ocr-btn">Clear OCR List</button>
          <!-- New Archive Buttons -->
          <button id="archive-btn">Archive Today's Data</button>
          <button id="view-journal-btn">View Archive</button>
        </div>
      </section>
      <section id="cropped-feed">
        <h2>Cropped Feed</h2>
        <canvas id="cropped-canvas"></canvas>
        <div id="stats-container">
          <div id="ocr-list-panel">
            <h2>OCR Numbers</h2>
            <div id="ocr-results-container"></div>
          </div>
          <div id="exp-panel">
            <div id="exp-rate">Exp Rate: N/A</div>
            <div id="time-till-reset">Time till reset: 00:00:00</div>
            <div id="daily-exp">Daily EXP: N/A</div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <p>Note: This feature requires browser support for the Screen Capture API.</p>
    </footer>
    <!-- Modal for Archived Journal -->
    <div id="journal-modal" class="modal">
      <div class="modal-content">
        <span class="modal-close">&times;</span>
        <h2>Archived Journal</h2>
        <div id="journal-entries"></div>
      </div>
    </div>
    <!-- Include Tesseract.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
    <!-- Main entry point -->
    <script src="./js/main.js" type="module"></script>

</body>
</html>
