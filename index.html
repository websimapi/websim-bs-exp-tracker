<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Window/Tab Capture with Cropping</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Include Tesseract.js for OCR (upgraded to 2.1.5 to help resolve worker loading issues) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
  </head>
  <body>
    <header>
      <h1>Live Window / Browser Tab Capture</h1>
    </header>
    <main>
      <section id="controls">
        <button id="capture-btn">Select Screen To Capture</button>
        <button id="crop-btn">Select Crop Region</button>
        <button id="reset-crop-btn" style="display:none;">Reset Crop</button>
      </section>
      <section id="display-container">
        <!-- Video container which will show the live screen capture -->
        <video id="capture-video" playsinline autoplay></video>
        <!-- Cropping overlay (positioned on top of the video) -->
        <div id="crop-overlay"></div>
      </section>
      <section id="cropped-feed">
        <h2>Cropped Feed</h2>
        <canvas id="cropped-canvas"></canvas>
        <!-- New Color Picker UI -->
        <div id="color-picker">
          <label>Click on cropped feed to pick color:</label>
          <div id="picked-color-swatch"></div>
          <span id="color-hex-value">#FFFFFF</span>
        </div>
        <!-- New OCR output container -->
        <div id="ocr-result">
          <h2>OCR Result</h2>
          <p id="ocr-text"></p>
        </div>
      </section>
    </main>
    <footer>
      <p>Note: This feature requires browser support for Screen Capture API.</p>
    </footer>
    <script src="script.js" type="module"></script>

</body>
</html>
